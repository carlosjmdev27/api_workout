# Serves the built SPA and proxies the API, so browser and API share one origin (no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # The API rejects JSON bodies over 10kb; stop anything much larger here.
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers go only on the static locations below: on /api helmet already sends
    # them, and a server-level add_header would duplicate them with conflicting values.

    # REST API -> backend service on the internal Docker network. No URI on proxy_pass:
    # the /api prefix is kept, as the Express routes expect.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite assets have a content hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routes (/routines/…, /workout/active/…): unknown paths fall back to index.html,
    # which is never cached so a new deploy is picked up at once.
    location / {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
